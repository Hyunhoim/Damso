<style>
:root{--paper:#ece8e1;--surface:#faf8f3;--ink:#353238;--muted:#69665e;--green:#526444;--sage:#dce3cc;--line:#d6d0c5;--error:#9d3430;font-family:'Noto Sans KR',sans-serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #8c9d70;outline-offset:4px}button:active{transform:translateY(1px)}.desk{max-width:1240px;margin:auto;padding:44px 36px;display:grid;grid-template-columns:1fr 390px;gap:64px;align-items:center;min-height:100vh}.notes{max-width:520px}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:700;color:var(--green)}.notes h1{font-size:44px;line-height:1.35;letter-spacing:-2px;margin:24px 0}.notes p{line-height:1.9;color:var(--muted)}.nav-list{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0}.nav-list button,.tools button{border:1px solid var(--line);border-radius:8px;background:transparent;padding:10px 12px;font-size:13px;color:var(--ink)}.nav-list button[aria-current=true]{background:var(--green);color:white;border-color:var(--green)}.swatches{display:flex;gap:16px;margin:32px 0}.swatches span{width:38px;height:38px;border-radius:50%;border:1px solid #0001;display:block}.swatches small{font-size:10px;color:var(--muted)}.notes a{color:var(--green);text-underline-offset:4px}.phone{width:390px;min-height:844px;background:var(--surface);border:1px solid var(--line);border-radius:32px;overflow:hidden;box-shadow:0 22px 65px #35323816;display:flex;flex-direction:column}.status{height:42px;padding:14px 25px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:700}.app{padding:0 26px 26px;display:flex;flex:1;flex-direction:column;min-height:800px}.top{height:58px;display:flex;align-items:center;justify-content:space-between}.back{border:0;background:transparent;width:44px;height:44px;margin-left:-12px;font-size:25px}.step{color:var(--muted);font-size:13px}.progress{height:3px;background:var(--line);margin:0 0 36px;border-radius:4px}.progress span{display:block;height:100%;background:var(--green)}h2{font-size:29px;line-height:1.48;letter-spacing:-1.2px;margin:0 0 14px}h3{font-size:21px;letter-spacing:-.6px;margin:0 0 12px}.description{font-size:16px;line-height:1.8;color:var(--muted);margin:0 0 30px}.grow{flex:1}.primary,.secondary{width:100%;min-height:56px;padding:13px 18px;border-radius:16px;border:0;font-size:17px;font-weight:700}.primary{background:var(--green);color:white}.secondary{background:transparent;color:var(--green);border:1px solid var(--line);margin-top:12px}.text-button{border:0;background:transparent;color:var(--muted);min-height:48px;width:100%;font-size:14px}.logo{width:256px;height:256px;object-fit:contain;border-radius:50%;mix-blend-mode:multiply;margin:44px auto 20px}.welcome{text-align:center}.welcome h2{font-size:34px}.welcome .description{margin-bottom:20px}.brand{font-size:22px;font-weight:700;letter-spacing:2px;margin-bottom:24px}.choice{display:flex;align-items:center;gap:18px;text-align:left;width:100%;padding:22px 20px;border:1px solid var(--line);background:transparent;border-radius:20px;margin-bottom:14px;color:var(--ink);min-height:100px}.choice[aria-pressed=true]{border:2px solid var(--green);background:#edf0e5;padding:21px 19px}.choice .symbol{font-size:26px;width:42px;color:var(--green)}.choice strong{display:block;font-size:20px;margin-bottom:5px}.choice small{font-size:14px;line-height:1.6;color:var(--muted)}.choice .radio{margin-left:auto;width:20px;height:20px;border:1px solid var(--line);border-radius:50%}.choice[aria-pressed=true] .radio{border:6px solid var(--green)}label.field{display:block;font-size:14px;font-weight:500;margin-bottom:22px}input{display:block;width:100%;height:56px;border:1px solid var(--line);background:white;border-radius:12px;padding:14px;margin-top:9px;color:var(--ink);font-size:17px}input::placeholder{color:#77736b}input[aria-invalid=true]{border-color:var(--error)}.check{display:flex;gap:10px;align-items:center;min-height:48px;font-size:14px}.check input{width:20px;height:20px;margin:0;accent-color:var(--green)}.error{font-size:14px;color:var(--error);min-height:24px;line-height:1.6;margin:10px 0}.note{background:#f0ece4;border-radius:16px;padding:18px;font-size:14px;line-height:1.8;color:var(--muted);margin:20px 0}.code-card{border:1px solid var(--line);border-radius:22px;padding:28px 18px;text-align:center;margin:8px 0 22px}.code{font-size:38px;letter-spacing:8px;font-weight:700;color:var(--green);margin:18px 0}.code-input{font-size:28px;text-align:center;letter-spacing:8px;text-transform:uppercase}.waiting{font-size:14px;text-align:center;color:var(--muted);margin:0 0 22px}.connection{margin:54px 0 32px;display:flex;justify-content:center;align-items:center;gap:16px}.avatar{width:78px;height:78px;border-radius:50%;background:var(--sage);display:grid;place-items:center;color:var(--green);font-size:25px;font-weight:700}.connection .avatar:last-child{background:#eadbca;color:#725b48}.connection i{font-style:normal;color:var(--green);font-size:28px}.center{text-align:center}.home .top{margin-bottom:24px}.home-logo{font-size:24px;font-weight:700;letter-spacing:1px}.family-tag{font-size:13px;color:var(--green);background:#e9eddf;padding:7px 12px;border-radius:20px}.date{font-size:13px;color:var(--muted);margin:0 0 10px}.home h2{font-size:27px;margin-bottom:22px}.question{border-radius:24px;background:#e8ecdd;padding:24px;margin-bottom:22px}.question .eyebrow{letter-spacing:0;font-size:13px}.question h3{font-size:23px;line-height:1.6;margin:16px 0 22px}.question .primary{border-radius:14px}.answer-state{display:flex;justify-content:space-between;margin:0 0 12px;font-size:14px}.answer-state span{color:var(--muted)}.lock-note{font-size:13px;line-height:1.7;color:var(--muted);margin:0;padding:12px 0 24px;border-bottom:1px solid var(--line)}.library{margin-top:22px}.section-title{display:flex;justify-content:space-between;align-items:center}.section-title h3{font-size:19px;margin:0}.section-title button{background:transparent;border:0;color:var(--muted);font-size:13px;min-height:44px}.empty-library{border:1px dashed var(--line);border-radius:18px;padding:22px;text-align:center;font-size:14px;color:var(--muted);line-height:1.8;margin-top:9px}.book-icon{font-size:27px;color:var(--green);margin-bottom:8px}.bottom-nav{border-top:1px solid var(--line);display:flex;justify-content:space-around;margin:24px -26px -26px;padding:12px 0 20px}.bottom-nav button{background:transparent;border:0;color:var(--muted);width:80px;min-height:48px;font-size:12px}.bottom-nav button span{display:block;font-size:20px;line-height:1.4}.bottom-nav button.selected{color:var(--green);font-weight:700}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.prototype-notice{font-size:12px!important}.board{padding:48px;display:grid;grid-template-columns:repeat(5,390px);gap:36px;background:var(--paper)}.board>header{grid-column:1/-1}.board>header h1{font-size:36px;margin:12px 0}.board>header p{color:var(--muted)}.board-item>p{font-size:14px;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:20px;max-width:330px;background:var(--surface);padding:24px;line-height:1.8;color:var(--ink)}dialog::backdrop{background:#35323866}@media(max-width:720px){.desk{display:block;padding:0;min-height:100vh}.notes{display:none}.phone{width:100%;min-height:100dvh;border:0;border-radius:0;box-shadow:none}.app{min-height:calc(100dvh - 42px)}.logo{margin-top:24px}.status{height:36px}.top{height:52px}.progress{margin-bottom:28px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<body><div id="root"></div><dialog id="notice"><h3>디자인 미리보기</h3><p id="notice-text"></p><button class="primary" onclick="document.querySelector('dialog').close()">확인</button></dialog>
<script>
const titles=['첫 만남','역할 선택','이름 입력','계정 만들기','가족 연결','코드 발급','코드 입력','가족 확인','부모 홈','자녀 홈','기억의 서재'];
const query=new URLSearchParams(location.search);
const fontChoices=[{id:'pretendard',family:'Pretendard',name:'Pretendard',tag:'01 / 깔끔한 고딕과 비교',description:'깔끔한 글자 형태. 질문, 안내문, 버튼을 고르게 정돈하는 조합.',source:'https://github.com/orioncactus/pretendard'},{id:'noto',family:'Noto Sans KR',name:'Noto Sans KR',tag:'02 / 초기 초안의 글꼴',description:'현재 초안의 글꼴. 단정하고 안정적인 고딕 인상을 유지하는 조합.',source:'https://fonts.google.com/noto/specimen/Noto+Sans+KR'},{id:'round',family:'NanumSquareRound',name:'나눔스퀘어라운드 Bold',tag:'03 / 두껍고 살짝 둥근 느낌',description:'본문 Bold 700, 질문 ExtraBold 800. 둥근 획과 선명한 글자의 조합.',source:'https://hangeul.naver.com/fonts/search?f=nanum'},{id:'paperlogy',family:'Paperlogy',name:'페이퍼로지',tag:'04 / 또렷한 글자와 균형 잡힌 굵기 · 적용 중',description:'본문·버튼 Bold 700, 질문 ExtraBold 800, 보조 안내 Regular 400.',source:'https://freesentation.blog/paperlogyfont'}];
let selectedFont=fontChoices.find(f=>f.id===query.get('font'))||fontChoices[3];
let screen=query.get('view')==='library'?10:query.get('home')==='child'?9:query.get('home')==='1'?8:0,role='parent',person='',email='',password='',terms=false,code='',error='';
const escapeText=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const notice=text=>{document.getElementById('notice-text').textContent=text;document.getElementById('notice').showModal()};
function go(i){if(i===8)role='parent';if(i===9)role='child';screen=i;error='';render();window.scrollTo(0,0);}
function progress(n){return `<div class="top"><button class="back" aria-label="이전 화면" data-back>‹</button><span class="step">${n} / 4</span></div><div class="progress"><span style="width:${n*25}%"></span></div>`}
const button=(text,next,cls='primary')=>`<button class="${cls}" data-go="${next}">${text}</button>`;
function homeNav(active,parent){return `<nav class="bottom-nav simple-nav" aria-label="주요 메뉴"><button data-go="${parent?8:9}" data-family-role="${parent?'parent':'child'}" class="${active==='today'?'selected':''}" ${active==='today'?'aria-current="page"':''}><span>${svg('home',26)}</span>오늘의 질문</button><button data-go="10" data-family-role="${parent?'parent':'child'}" class="${active==='library'?'selected':''}" ${active==='library'?'aria-current="page"':''}><span>${svg('book',26)}</span>기억의 서재</button></nav>`;}
function content(i,board=false){const parent=i===8||(i!==9&&role==='parent');const who=board?'지영':escapeText(person||'지영');switch(i){
case 0:return `<div class="top"><span class="brand">담소</span><span class="step">우리의 이야기가 머무는 곳</span></div><img class="logo" src="/logo/damso-logo.png" alt="부모와 자녀가 담긴 찻잔 담소 로고"><div class="welcome"><h2>서로의 하루를,<br>조금 더 가까이.</h2><p class="description">하루 한 질문으로 나누는 이야기.<br>우리 가족의 기억이 차곡차곡 쌓여요.</p></div><div class="grow"></div>${button('담소 시작하기',1)}<button class="text-button" data-notice="로그인 화면은 이번 초안의 범위에 포함되지 않았어요.">이미 계정이 있어요</button>`;
case 1:return `${progress(1)}<h2>누가 담소를<br>사용하시나요?</h2><p class="description">역할에 맞는 질문을 준비해 드릴게요.</p><button class="choice" data-role="parent" aria-pressed="${parent}"><span class="symbol" aria-hidden="true">♧</span><span><strong>부모로 시작하기</strong><small>자녀에게 내 이야기를 남겨요.</small></span><span class="radio"></span></button><button class="choice" data-role="child" aria-pressed="${!parent}"><span class="symbol" aria-hidden="true">♡</span><span><strong>자녀로 시작하기</strong><small>부모님께 오늘의 하루를 남겨요.</small></span><span class="radio"></span></button><div class="grow"></div>${button('다음',2)}`;
case 2:return `${progress(2)}<h2>어떻게<br>불러드릴까요?</h2><p class="description">가족에게 보일 이름을 알려주세요.</p><label class="field">이름<input name="person" autocomplete="name" maxlength="20" placeholder="이름을 입력해주세요" value="${board?'지영':who==='지영'&& !person?'':who}"></label><p class="error" role="alert">${escapeText(error)}</p><div class="grow"></div>${button('다음',3)}`;
case 3:return `${progress(3)}<h2>이야기를 담을<br>계정을 만들어요.</h2><p class="description">다음에도 같은 계정으로 만나세요.</p><label class="field">이메일<input name="email" type="email" autocomplete="email" placeholder="example@email.com" value="${escapeText(email)}"></label><label class="field">비밀번호<input name="password" type="password" autocomplete="new-password" minlength="8" placeholder="8자 이상 입력해주세요" value="${escapeText(password)}"></label><label class="check"><input name="terms" type="checkbox" ${terms?'checked':''}>[필수] 이용약관 및 개인정보 수집 동의</label><button class="text-button" data-notice="실제 가입 전에 확정된 이용약관과 개인정보 처리방침을 각각 제공해야 해요. 현재는 화면 구성용 예시입니다.">약관 내용 보기</button><p class="error" role="alert">${escapeText(error)}</p><div class="grow"></div>${button('가입하고 가족 연결하기',4)}`;
case 4:return `${progress(4)}<h2>이제 가족과<br>연결해 볼까요?</h2><p class="description">두 사람이 연결되면<br>함께 질문에 답할 수 있어요.</p><button class="choice" data-go="5"><span class="symbol" aria-hidden="true">↗</span><span><strong>연결 코드 만들기</strong><small>가족에게 코드를 알려주세요.</small></span></button><button class="choice" data-go="6"><span class="symbol" aria-hidden="true">⌨</span><span><strong>받은 코드 입력하기</strong><small>가족이 보내준 코드가 있어요.</small></span></button><div class="note">부모님과 자녀 중 한 사람이 코드를 만들고,<br>다른 한 사람이 입력하면 돼요.</div><div class="grow"></div>`;
case 5:return `<div class="top"><button class="back" aria-label="이전 화면" data-back>‹</button><span class="step">가족 연결</span></div><h2>이 코드를<br>가족에게 알려주세요.</h2><p class="description">가족이 ‘받은 코드 입력하기’에서<br>입력하면 연결 요청이 도착해요.</p><div class="code-card"><span class="step">우리 가족 연결 코드</span><div class="code">DAMSO7</div><button class="secondary" data-copy>코드 복사하기</button></div><p class="waiting" role="status">○ 가족의 연결을 기다리고 있어요</p><div class="note">코드는 연결할 가족에게만 알려주세요.<br>입력이 끝나면 상대방을 한 번 더 확인해요.</div><div class="grow"></div>${button('받은 코드로 연결할게요',6,'secondary')}`;
case 6:return `<div class="top"><button class="back" aria-label="이전 화면" data-back>‹</button><span class="step">가족 연결</span></div><h2>가족에게 받은<br>코드를 입력해주세요.</h2><p class="description">영문과 숫자로 된 6자리 코드예요.</p><label class="field">연결 코드<input name="code" class="code-input" maxlength="6" autocapitalize="characters" spellcheck="false" placeholder="______" value="${escapeText(code)}"></label><p class="error" role="alert">${escapeText(error)}</p><div class="note">코드가 없다면 먼저 만들어서<br>가족에게 전달할 수 있어요.</div><button class="text-button" data-go="5">연결 코드 만들기</button><div class="grow"></div>${button('가족 확인하기',7)}`;
case 7:return `<div class="top"><button class="back" aria-label="이전 화면" data-back>‹</button><span class="step">연결 확인</span></div><div class="connection"><div class="avatar">${parent?'부모':'자녀'}</div><i aria-hidden="true">♡</i><div class="avatar">${parent?'자녀':'부모'}</div></div><div class="center"><h2>함께할 가족이<br>맞나요?</h2><p class="description">${who}님과 <strong>${parent?'민수':'지영'}</strong>님이<br>담소를 함께 시작할 준비가 됐어요.</p></div><div class="note">가족이 남긴 이야기를<br>언제든 확인할 수 있어요.</div><div class="grow"></div>${button('맞아요, 담소 시작하기',parent?8:9)}${button('다른 코드 입력하기',6,'secondary')}`;
case 8:case 9:return `<div class="home simple-home"><header class="top"><span class="home-logo">담소</span><span class="date">10월 6일 화요일</span></header><section class="today-question" aria-label="오늘의 질문"><p class="eyebrow">오늘의 질문</p><h2>${parent?'어릴 때 가장<br>좋아했던 집밥은<br>무엇이었나요?':'오늘 먹은 음식 중<br>기억에 남는 건<br>무엇인가요?'}</h2><div class="voice-action"><button class="voice-answer" aria-label="목소리로 답하기" data-notice="녹음 화면의 디자인 예시입니다. 현재 마이크를 켜거나 음성을 저장하지 않아요."><span class="mic-disc">${svg('mic',64)}</span><span>눌러서 이야기하기</span></button><button class="text-button" data-notice="글로 답하기 화면은 다음 디자인 범위예요.">글로 남기기</button></div></section>${homeNav('today',parent)}</div>`;
case 10:return `<div class="home library-home"><header class="top"><span class="home-logo">담소</span></header><section class="library-page" aria-labelledby="library-title"><h2 id="library-title">기억의 서재</h2><p class="description">우리 가족의 이야기를<br>날짜별로 다시 만나요.</p><div class="library-empty"><span aria-hidden="true">${svg('book',56)}</span><h3>아직 남긴 이야기가 없어요</h3><p>이야기를 남기면<br>이곳에 차곡차곡 모아둘게요.</p><button class="secondary" data-go="${parent?8:9}">오늘의 질문에 답하기</button></div></section>${homeNav('library',parent)}</div>`;
}}
const iconPaths={heart:'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z',book:'M3 4h7a3 3 0 0 1 3 3v14a4 4 0 0 0-4-3H3V4Zm18 0h-5a3 3 0 0 0-3 3v14a4 4 0 0 1 4-3h4V4Z',home:'M3 10 12 3l9 7v11h-6v-7H9v7H3V10Z',mic:'M12 15a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v7a3 3 0 0 0 3 3Zm-7-4v1a7 7 0 0 0 14 0v-1M12 19v3m-4 0h8',person:'M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM4 21v-2a8 8 0 0 1 16 0v2',arrow:'M5 12h14m-6-6 6 6-6 6',key:'M9 15a5 5 0 1 1 3-3l-9 9-2-2 9-9'};
const svg=(name,size=24)=>`<svg aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><path d="${iconPaths[name]}"/></svg>`;
function decorate(s){return s.replace('<span class="symbol" aria-hidden="true">♧</span>',`<span class="symbol">${svg('person',28)}</span>`).replace('<span class="symbol" aria-hidden="true">♡</span>',`<span class="symbol">${svg('heart',28)}</span>`).replace('<span class="symbol" aria-hidden="true">↗</span>',`<span class="symbol">${svg('arrow',28)}</span>`).replace('<span class="symbol" aria-hidden="true">⌨</span>',`<span class="symbol">${svg('key',28)}</span>`).replace('♩ &nbsp;',svg('mic',20)+' &nbsp;').replace('<div class="book-icon" aria-hidden="true">▥</div>',`<div class="book-icon">${svg('book',28)}</div>`).replace('<span aria-hidden="true">⌂</span>',`<span>${svg('home',22)}</span>`).replace('<span aria-hidden="true">▥</span>',`<span>${svg('book',22)}</span>`).replace('<span aria-hidden="true">♡</span>',`<span>${svg('heart',22)}</span>`).replace('<i aria-hidden="true">♡</i>',svg('heart',28));}
function phone(i,board=false){return `<div class="phone"><div class="status"><span>9:41</span><span aria-hidden="true">▮▮▮ &nbsp; ▰</span></div><main class="app ${i>=8?'app-home':''}" aria-label="${titles[i]}">${decorate(content(i,board))}</main></div>`}
function render(){const homes=query.has('homes');const board=query.has('board')||homes;document.documentElement.style.setProperty('--app-font',`'${selectedFont.family}'`);document.documentElement.style.setProperty('--body-weight',['round','paperlogy'].includes(selectedFont.id)?'700':'400');document.documentElement.style.setProperty('--heading-weight',['round','paperlogy'].includes(selectedFont.id)?'800':'700');document.getElementById('root').innerHTML=query.has('fonts')?fontComparison():board?`<div class="board ${homes?'home-board':''}"><header><div class="eyebrow">DAMSO / FIRST ENCOUNTER / DESIGN 01</div><h1>${homes?'담소 · 질문에 집중하는 홈':'담소 · 첫 만남'}</h1><p>베이지 바탕과 찻잔 로고, 녹색 버튼으로 가족의 이야기를 편안하게 이어갑니다.</p><p class="board-flow">가입 → 코드 발급 또는 입력 → 가족 확인 → 첫 홈 &nbsp; | &nbsp; 큰 질문과 마이크 · 기억의 서재는 별도 탭</p><p class="board-meta">본문·버튼: 페이퍼로지 Bold / 질문·제목: ExtraBold / 앱 이름: 꽃길 &nbsp; · &nbsp; 계정과 연결은 디자인 예시</p></header>${(homes?[8,9,10]:titles.slice(0,10).map((_,i)=>i)).map(i=>`<div class="board-item"><p>${String(i+1).padStart(2,'0')} / ${titles[i]}</p>${phone(i,true)}</div>`).join('')}</div>`:`<div class="desk"><aside class="notes"><div class="eyebrow">DAMSO / FIRST ENCOUNTER</div><h1>차 한 잔의 온도로,<br>가족의 하루를 잇다.</h1><p>기존 담소의 찻잔 로고와 따뜻한 베이지를 이어<br>처음 만나는 화면을 차분하게 구성했습니다.</p><div class="swatches">${['#ece8e1','#faf8f3','#526444','#dce3cc','#353238'].map(c=>`<div><span style="background:${c}"></span><small>${c}</small></div>`).join('')}</div><div class="nav-list" aria-label="초안 화면 선택">${titles.map((t,i)=>`<button data-go="${i}" aria-current="${i===screen}">${String(i+1).padStart(2,'0')} ${t}</button>`).join('')}</div><label class="font-picker">본문 폰트 미리보기<select id="font-picker">${fontChoices.map(f=>`<option value="${f.id}" ${f.id===selectedFont.id?'selected':''}>${f.name}${f.id==='paperlogy'?' · 적용 중':''}</option>`).join('')}</select><a href="?fonts">같은 화면으로 폰트 비교하기 ↗</a></label><p class="prototype-notice">디자인 검토용입니다. 계정과 연결 코드는 실제로 생성되지 않으며,<br>입력값은 서버로 전송하거나 저장하지 않습니다.</p><a href="?board&font=${selectedFont.id}">전체 화면 보드 보기 ↗</a><div class="tools"><button data-go="0">처음부터 살펴보기</button>${screen===5?'<button data-demo>데모: 가족 연결 요청 도착</button>':''}</div></aside>${phone(screen)}</div>`;bind(board);const picker=document.getElementById('font-picker');if(picker)picker.onchange=()=>{selectedFont=fontChoices.find(f=>f.id===picker.value)||fontChoices[3];render();}}
function fontComparison(){return `<div class="type-page"><header><div class="eyebrow">DAMSO / TYPOGRAPHY STUDY</div><h1>제목은 꽃길, 이야기는 또렷하게.</h1><p>‘담소’ 제목은 상상토끼 꽃길로 고정했습니다. 본문 후보 4개를 같은 크기와 문장으로 비교해 보세요.<br>폰트 크기: 홈 질문 34px · 음성 버튼 안내 20px · 읽기 예문 18px</p><a href="?">온보딩 초안으로 돌아가기 ↗</a></header><div class="type-grid">${fontChoices.map(f=>`<section class="type-option" style="--app-font:'${f.family}';--body-weight:${['round','paperlogy'].includes(f.id)?700:400};--heading-weight:${['round','paperlogy'].includes(f.id)?800:700}" aria-label="${f.name} 예시"><div class="type-caption"><div class="eyebrow">${f.tag}</div><h2>${f.name}</h2><p>${f.description}</p><a href="?font=${f.id}&home=1">이 폰트로 전체 화면 보기 ↗</a></div>${phone(8,true)}<div class="type-specimen"><small>긴 문장 / 18px · 같은 크기로 비교</small><p>오늘은 첫 월급으로 어머니께 선물을 드렸던 기억을 남겼어요. 서로의 이야기를 천천히 읽고, 다음에 만날 때 그날의 마음을 나눠보세요.</p><p class="digits">가나다라마바사 · 0123456789 · 10월 6일</p></div></section>`).join('')}</div><footer class="type-footer">글꼴 출처: ${fontChoices.map(f=>`<a href="${f.source}" target="_blank" rel="noopener">${f.name}</a>`).join(' · ')}<br>각 후보의 인상과 추천은 디자인 검토 의견입니다. 최종 가독성은 부모·자녀 사용자에게 실제 화면으로 확인해야 합니다.</footer></div>`;}
function bind(board){document.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>{let target=Number(el.dataset.go);const preview=el.closest('.notes');if(el.dataset.familyRole)role=el.dataset.familyRole;if(!board&&!preview){if(screen===2&&target===3&&!person.trim()){error='가족에게 보일 이름을 입력해주세요.';render();return}if(screen===3&&target===4){if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)||password.length<8||!terms){error='이메일, 8자 이상의 비밀번호와 필수 동의를 확인해주세요.';render();return}password=''}if(screen===6&&target===7&&!/^[A-Z0-9]{6}$/.test(code)){error='영문과 숫자 6자리로 입력해주세요.';render();return}}go(target)});document.querySelectorAll('[data-back]').forEach(el=>el.onclick=()=>go(screen===6||screen===5?4:screen===7?6:Math.max(0,screen-1)));document.querySelectorAll('[data-role]').forEach(el=>el.onclick=()=>{role=el.dataset.role;render()});document.querySelectorAll('input').forEach(el=>el.oninput=()=>{if(el.name==='person')person=el.value;if(el.name==='email')email=el.value;if(el.name==='password')password=el.value;if(el.name==='terms')terms=el.checked;if(el.name==='code'){code=el.value.toUpperCase().replace(/[^A-Z0-9]/g,'');el.value=code}});document.querySelectorAll('[data-notice]').forEach(el=>el.onclick=()=>notice(el.dataset.notice));document.querySelectorAll('[data-copy]').forEach(el=>el.onclick=async()=>{try{await navigator.clipboard.writeText('DAMSO7');el.textContent='복사했어요'}catch{notice('코드를 길게 눌러 복사해주세요: DAMSO7')}});document.querySelectorAll('[data-demo]').forEach(el=>el.onclick=()=>go(7))}
render();
</script>
</body></html>
